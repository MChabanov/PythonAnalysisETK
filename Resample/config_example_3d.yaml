# ---------------------------------------------------------------------------
# Configuration for the 3D -> plane resampling pipeline.
#
# Copy this file, edit it for your simulation, and run:
#
#     mpirun -n <N> python resample_3d.py my_config_3d.yaml
#
# This reads the FULL 3D output (*.xyz.h5 / *.file_*.h5) and interpolates it
# onto a 2D grid lying in a plane you specify by its normal vector. Use
# config_example.yaml instead when Carpet already wrote the 2D slice you want
# (*.xy.h5 etc.) - that is much cheaper, so prefer it for xy/xz/yz cuts.
#
# Everything below that is not under `plane` behaves exactly as in the 2D
# pipeline, and the output files use the same schema: the in-plane coordinates
# (u, v) are stored as the `x` and `y` axes, so ../Frames/make_frames.py and
# read_data.py work on them unchanged.
# ---------------------------------------------------------------------------

# Reader library. Currently only postcactus has a 3D backend.
backend: postcactus

# Absolute path to the Einstein Toolkit simulation directory.
simdir: /lagoon/michailchabanov/BBH_production/my_run

# THE PLANE ------------------------------------------------------------------
# Three kinds, selected by `kind`: a fixed plane (`static`, the default), one
# you define yourself as a function of time (`analytic`), or one tied to a
# binary's trajectory (`trajectory`). The last two rotate with time; their frame
# is precomputed for every output iteration before any data is read, and stored
# in the output as per-iteration datasets.
#
# ---- kind: static (default) -------------------------------------------------
# Either one of the 2D pipeline's shorthands - xy, xz, yz, meaning the plane
# through the origin with that normal - or a mapping:
#
#   normal:  the plane's normal. Three numbers or an axis name (x, y, z).
#            Need not be a unit vector; its sign does not matter.
#   origin:  optional, a point the plane passes through (default [0, 0, 0]).
#            Use it to offset the plane, e.g. an xy cut at z = 10.
#   u_axis:  optional, fixes the rotation of the coordinates *within* the
#            plane; it is projected into the plane and becomes the +u
#            direction (the output's `x` axis).
#
# In-plane axes by default: the coordinate axis most aligned with the normal is
# dropped and the other two are kept in x < y < z order. So an axis-aligned
# normal reproduces the 2D pipeline exactly - normal z gives (u, v) = (x, y),
# normal y gives (x, z), normal x gives (y, z) - which makes an axis-aligned 3D
# cut directly comparable with the corresponding resample_2d.py output.
#
plane: xz
#
# plane:                            # a plane tilted 45 degrees about the x axis
#   normal: [0.0, 1.0, 1.0]
#   origin: [0.0, 0.0, 0.0]
# plane:                            # an xy cut at z = 10
#   normal: z
#   origin: [0.0, 0.0, 10.0]
# plane:                            # oblique, with the in-plane u axis pinned
#   normal: [1.0, 1.0, 0.0]         # to the projection of the x axis
#   origin: [0.0, 0.0, 0.0]
#   u_axis: x
#
# ---- kind: trajectory ------------------------------------------------------
# The plane follows a binary read from a trajectory HDF5 file (positions t,
# x1..z2, and optionally velocities vx1.., spins a1x.., masses m1/m2 or
# m1_full/m2_full). Normally you name a `second_vector` and the plane spans it
# together with the separation vector, so BOTH bodies lie in the plane at every
# time and it tilts whenever they leave it.
#
# plane:
#   kind: trajectory
#   file: auto              # path, or auto = AnalyticalSpacetime::traj_table_name
#   time_offset: auto       # t_trajectory = t_simulation + this.
#                           # auto = AnalyticalSpacetime::AST_t0 from the parfile.
#                           # GETTING THIS WRONG ROTATES THE PLANE BY A CONSTANT
#                           # ANGLE WITH NO OTHER SYMPTOM - prefer auto, and see
#                           # inspect_plane.py to check it.
#   origin: com             # com (mass-weighted) | midpoint | bh1 | bh2 |
#                           # [x,y,z] | module
#   second_vector: orbital  # which second direction lies in the plane:
#     #  orbital             the relative velocity v2 - v1. Separation +
#     #                      relative velocity span the INSTANTANEOUS ORBITAL
#     #                      PLANE by definition, so this is exact for an
#     #                      inclined, precessing or eccentric orbit.
#     #  orbital_meridional  the orbital angular momentum axis d x v_rel. A
#     #                      meridional cut through both bodies, vertical with
#     #                      respect to the ORBIT and perpendicular to the
#     #                      orbital motion.
#     #  spin1 / spin2       that body's spin axis: its meridional plane facing
#     #                      the companion. Natural with origin: bh1 / bh2.
#     #  equatorial          z x separation - the coordinate-frame version of
#     #                      `orbital`, valid only while the orbit stays at z=0.
#     #  meridional          the z axis - the coordinate-frame version of
#     #                      `orbital_meridional`, same caveat.
#     #  [x,y,z]             a constant direction. Careful: a binary that turns
#     #                      through it makes the plane degenerate there (the
#     #                      pipeline checks and refuses).
#     #  module              second_vector(t, it) from `module` below.
#   u_axis: separation      # which in-plane direction is +u (the output's `x`):
#     #  separation          CO-ROTATING (default): +u follows the separation, so
#     #                      the bodies sit still at u = +-(distance to origin),
#     #                      v = 0 and only the gas moves.
#     #  x / y / z           INERTIAL: the frame stays as near that fixed
#     #                      direction as the plane allows, so the binary
#     #                      visibly orbits inside the frame.
#     #  second | spin1 | spin2 | [x,y,z] | module
#
# Instead of `second_vector` you may give `normal` directly, for a plane that
# need NOT contain the separation vector - most usefully one body's equatorial
# plane, the one its accretion flow wants to align with:
#
# plane:
#   kind: trajectory
#   normal: spin1           # orbital | spin1 | spin2 | x/y/z | [x,y,z] | module
#   origin: bh1
#
# ---- kind: analytic --------------------------------------------------------
# You supply a Python module defining normal(t, it), and optionally
# origin(t, it) and u_axis(t, it). Copy plane_module_example.py and edit it.
# Only rank 0 imports it (that is where the frames are built), so it may do
# anything. Paths are relative to the working directory.
#
# plane:
#   kind: analytic
#   module: ./my_plane.py
#   # origin: [0, 0, 0]     # used if the module defines no origin()
#   # u_axis: x             # used if the module defines no u_axis(); omitting
#                           # both lets the pipeline pick the coordinate axis
#                           # least aligned with the normal over the whole run,
#                           # which is continuous in time
#
# NOTE for any rotating plane: with u_axis: separation the frame turns with the
# binary, so the output cadence has to resolve the ORBIT, not just the flow. The
# startup log reports the total turn and the largest step between consecutive
# frames, and warns above 30 degrees per frame.

# Optional: cache the scanned SimDir as a pickle to speed up startup.
# NOTE: this must be a pickle that INCLUDES the 3D output - one written by a 2D
# run whose simdir_exclude pruned the 3D directory is missing exactly the files
# needed here. Keep separate pickles for the 2D and 3D pipelines.
# simdir_pickle:
#   pickled: no
#   path: ./simdir_cache_3d.pkl

# Optional scan exclusions. CAREFUL: unlike a 2D config, this one must NOT
# exclude the 3D output. Excluding the 2D/1D directories instead is what speeds
# this scan up. (The backend refuses to run if `files` would hide 3D data, but
# it cannot tell which of your directory names holds it.)
# simdir_exclude:
#   dirs: ["Checkpoint", "HDF5_1D", "HDF5_2D", "Miscellaneous"]
#   files: []

# Short label used in output file names (e.g. rho_b__my_run_tilted.h5).
label: my_run_tilted

# Directory where the resampled HDF5 files are written (created if missing).
output_dir: ./resampled_tilted

# Directory scan mode (see config_example.yaml). Default: yes.
parallel_scan: yes

# Maximum directory recursion depth for the scan. Default: 8.
scan_max_depth: 8

# The 2D grid inside the plane ------------------------------------------------
# Interpreted in the in-plane coordinates (u, v), otherwise identical to the 2D
# pipeline: this is what ends up as the output's `x` and `y` axes.
grid:
  # Number of grid POINTS along each axis (not cells).
  resolution: [800, 800]
  # Square patch [-box_bound, +box_bound] in u and v, centred on `plane.origin`.
  box_bound: 40.0
  # Optional explicit bounds; if given they override box_bound.
  # min: [-40.0, -20.0]
  # max: [ 40.0,  20.0]

# Interpolation order: 0 = nearest, 1 = linear (as in the 2D pipeline).
# 2..5 select spline interpolation of that order.
interp_order: 1

# Value for plane points no refinement level covers (outside the 3D domain).
outside_value: 0.0

# Output storage dtype. float32 halves file size; float64 preserves precision.
dtype: float64

# Iteration query mode (see config_example.yaml). Default: yes.
parallel_query: yes

# Resampling granularity (see config_example.yaml). Worth raising for 3D, where
# a slice costs seconds rather than milliseconds: with more ranks than variables
# this is what keeps them busy. Default: 1.
resample_chunks: 1

# Subsample iterations: keep every Nth available iteration (1 = keep all).
# 3D output is usually written far less often than 2D, so this is rarely needed.
iteration_stride: 1

# Optionally restrict the iteration range (null = no limit).
iteration_min: null
iteration_max: null

# gzip compression level for the HDF5 datasets (0-9; null disables compression).
compression_level: 4

# Variables to resample and store. Each becomes its own HDF5 file. These must
# exist as 3D output; the names are the same as for 2D.
variables:
  - rho_b
  - P
  - eps
  - vel[0]
  - vel[1]
  - vel[2]
  - alp
  - w_lorentz
  - smallb2
